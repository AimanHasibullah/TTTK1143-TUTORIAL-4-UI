<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataSet Polymorphism Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>DataSet Polymorphism Visualizer</h1>
      <p>Simulating <code>Measurable</code> objects (BankAccount, Coin, Student)</p>
    </header>

    <div class="grid">
      <!-- Controls -->
      <div class="card">
        <h2>Add Measurable Item</h2>

        <div class="form-group">
          <label for="itemType">Select Class</label>
          <select id="itemType">
            <option value="BankAccount">BankAccount</option>
            <option value="Coin">Coin</option>
            <option value="Student">Student</option>
          </select>
        </div>

        <div class="form-group">
          <label for="itemName">Item Name / Identifier</label>
          <input type="text" id="itemName" placeholder="e.g. Quarter, Alex (Auto-generated for BankAccount)">
        </div>

        <div class="form-group">
          <label for="itemMeasure">Measure Value (Balance / Value / Height)</label>
          <input type="number" step="0.01" id="itemMeasure" placeholder="e.g. 10000 or 0.25 or 165.00">
        </div>

        <button id="addBtn">Add to DataSet</button>
        <button id="loadPresetBtn" class="secondary">Load Sample Output Data</button>
        <button id="resetBtn" class="danger">Reset DataSet</button>
      </div>

      <!-- Results Display -->
      <div class="card">
        <h2>DataSet Metrics</h2>
        <div class="metrics">
          <div class="metric-box">
            <span class="label">Count</span>
            <span class="value" id="countVal">0</span>
          </div>
          <div class="metric-box">
            <span class="label">Average</span>
            <span class="value" id="avgVal">0.00</span>
          </div>
          <div class="metric-box">
            <span class="label">Max Name</span>
            <span class="value" id="maxNameVal">N/A</span>
          </div>
          <div class="metric-box">
            <span class="label">Max Measure</span>
            <span class="value" id="maxMeasureVal">0.00</span>
          </div>
        </div>

        <h3>Item List</h3>
        <ul id="itemList" class="item-list"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
